<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Locaciones Municipales</title>
    
    <!-- Cargo los estilos de Leaflet para la renderización del mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
    /* Reseteo general y variables de estructura */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f9; }
    
    header { background: #1e293b; color: #fff; padding: 14px 20px; flex-shrink: 0; }
    header h2 { font-size: 18px; font-weight: 500; }
    
    /* Layout de la barra superior de filtros */
    .filter-bar { background: #fff; padding: 12px 20px; display: flex; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
    .filter-group label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; }
    
    .filter-group select, .filter-group input { 
        padding: 7px 10px; border-radius: 4px; border: 1px solid #cbd5e1; 
        width: 100%; font-size: 13px; color: #334155; outline: none; 
    }
    .filter-group select:focus, .filter-group input:focus { border-color: #3b82f6; }
    
    /* Contenedor dividido entre mapa y panel */
    .main-container { display: flex; flex: 1; width: 100%; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; position: relative; min-height: 250px; }
    
    /* Estilos del panel lateral derecho para listado de resultados */
    .sidebar-right { 
        width: 340px; background: #fff; border-left: 1px solid #e2e8f0; 
        display: flex; flex-direction: column; height: 100%;
    }
    
    .sidebar-header { padding: 12px 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
    .sidebar-header h3 { font-size: 15px; color: #0f172a; display: flex; justify-content: space-between; align-items: center; }
    .counter-badge { background: #3b82f6; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; } 
    
    .sidebar-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    
    /* Tarjeta individual dentro del panel de resultados */
    .list-item { 
        padding: 10px; border: 1px solid #e2e8f0; border-radius: 4px; background: #fff; cursor: pointer;
        transition: background 0.15s ease; border-left: 4px solid #cbd5e1;
    }
    .list-item:hover { border-color: #3b82f6; background: #f8fafc; }
    .list-item h4 { font-size: 13px; color: #0f172a; margin-bottom: 4px; }
    .list-item p { font-size: 12px; color: #64748b; margin: 2px 0; }
    
    /* Cartelito flotante para ver el estado de lectura del CSV */
    #status-box { 
        position: absolute; bottom: 15px; left: 15px; background: rgba(255,255,255,0.9); 
        padding: 8px 12px; border-radius: 4px; z-index: 1000; font-size: 12px; font-weight: 600; 
        color: #334155; border-left: 3px solid #3b82f6; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* Logo flotante */
    .logo-muni {
        position: absolute; top: 10px; right: 10px; height: 50px; z-index: 1000; 
        background: rgba(255, 255, 255, 0.9); padding: 5px 10px; border-radius: 4px; 
        box-shadow: 0 1px 4px rgba(0,0,0,0.1); pointer-events: none;
    }
    
    /* Ficha catastral desplegable en los pines */
    .popup-ficha { min-width: 240px; font-size: 12px; color: #334155; }
    .popup-ficha h3 { font-size: 14px; margin-bottom: 6px; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    .popup-ficha p { margin: 4px 0; line-height: 1.3; }
    
    .tabla-catastro { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 10px; text-align: center; }
    .tabla-catastro th { background: #f1f5f9; color: #475569; padding: 3px; border: 1px solid #e2e8f0; }
    .tabla-catastro td { padding: 3px; border: 1px solid #e2e8f0; color: #0f172a; font-weight: 600; }
    
    .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; }
    .badge.propio { background: #10b981; }
    .badge.alquiler { background: #f59e0b; }
    .badge.comodato { background: #3b82f6; }
    .badge.ceamse { background: #8b5cf6; }
    .badge.ferrocarril { background: #6b7280; }
    .badge.otros { background: #94a3b8; }

    /* Adaptación para pantallas chicas y celulares */
    @media (max-width: 768px) {
        body { height: auto; min-height: 100vh; }
        .filter-bar { padding: 10px; gap: 8px; }
        .filter-group { min-width: 100%; }
        
        .main-container { flex-direction: column; height: auto; overflow: visible; }
        #map { height: 50vh; width: 100%; }
        .sidebar-right { width: 100%; height: 50vh; border-left: none; border-top: 1px solid #e2e8f0; }
        .logo-muni { height: 40px; }
    }
</style>
</head>
<body>

    <!-- Encabezado simple de la herramienta -->
    <header>
        <h2>Visualizador de Locaciones e Infraestructura Municipal</h2>
    </header>

    <!-- Barra con los selectores y buscadores dinámicos que se pueblan desde app.js -->
    <div class="filter-bar">
        <div class="filter-group">
            <label>Subsecretaría</label>
            <select id="filter-subsecretaria" onchange="filtrarLocaciones()">
                <option value="todos">Todas</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>Régimen / Condición</label>
            <select id="filter-regimen" onchange="filtrarLocaciones()">
                <option value="todos">Todos</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Pertenencia / Titular</label>
            <select id="filter-pertenencia" onchange="filtrarLocaciones()">
                <option value="todos">Todos</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Cobertura de Seguro</label>
            <select id="filter-seguro" onchange="filtrarLocaciones()">
                <option value="todos">Todas las Coberturas</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Buscar por Espacio</label>
            <input type="text" id="search-espacio" list="sugerencias-espacio" placeholder="Ej: Palacio..." oninput="filtrarLocaciones()">
            <datalist id="sugerencias-espacio"></datalist>
        </div>

        <div class="filter-group">
            <label>Buscar por Dirección</label>
            <input type="text" id="search-direccion" list="sugerencias-direccion" placeholder="Ej: Belgrano..." oninput="filtrarLocaciones()">
            <datalist id="sugerencias-direccion"></datalist>
        </div>
    </div>

    <!-- Bloque central: mapa interactivo a la izquierda y listado a la derecha -->
    <div class="main-container">
        <div id="map">
            <!-- Muestro mensajes del script según si está leyendo el CSV o falló -->
            <div id="status-box">Cargando datos...</div>

            <!-- Logo institucional encima del mapa -->
            <img src="sm.png" alt="Logo" class="logo-muni">
        </div>

        <!-- Panel con la lista filtrada de elementos -->
        <div class="sidebar-right">
            <div class="sidebar-header">
                <h3>Resultados <span id="contador-resultados" class="counter-badge">0</span></h3>
            </div>
            <div id="contenedor-lista" class="sidebar-list">
                <!-- Inyecto las cards dinámicamente desde el JS -->
            </div>
        </div>
    </div>

    <!-- Librería para el mapa (Leaflet) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Librería para parsear el archivo CSV (PapaParse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Mi js -->
    <script src="js/app.js"></script>
</body>
</html>
